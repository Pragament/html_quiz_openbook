<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quiz-formats.css">
</head>
<body>
    <!-- Auth Section (shared with index) -->
    <div id="auth-section" class="position-fixed top-0 end-0 p-3" style="z-index: 1000;">
        <div id="user-info" class="d-none">
            <div class="d-flex align-items-center gap-2">
                <span id="user-name" class="text-dark fw-medium"></span>
                <button id="logout-btn" class="btn btn-sm btn-outline-danger">Logout</button>
            </div>
        </div>
        <div class="d-flex gap-2 hidden">
            <button id="login-btn" class="btn btn-primary"><i class="bi bi-google"></i> Login with Google</button>
            <button id="student-login-btn" class="btn btn-outline-primary bg-white"><i class="bi bi-person-fill"></i> Student Login</button>
        </div>
    </div>

    <!-- Quiz Interface (core for taking a quiz) -->
    <div id="quiz-interface" class="container-fluid py-3">
        <div class="alert alert-warning hidden" id="round-indicator"></div>
        <div class="row g-3">
            <div class="col-lg-6" id="questions-section">
                <div class="glass-card h-100 d-flex flex-column" style="max-height: calc(100vh - 100px);">
                    <div class="p-3 border-bottom hidden">
                        <div class="d-flex justify-content-between">
                            <h5 class="text-primary fw-bold" id="quiz-title-display"></h5>
                            <div class="d-flex align-items-center gap-3">
                                <span id="timer-display" class="badge bg-warning text-dark"></span>
                                <span id="round-display" class="badge bg-info"></span>
                            </div>
                        </div>
                    </div>
                    <div class="p-3">
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Progress</span>
                                <span id="progress-text">0/0</span>
                            </div>
                            <div class="progress">
                                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="questions-nav-container">
                            <button class="nav-btn prev-btn" onclick="scrollQuestions(-1)">&#8249;</button>
                            <div class="question-navigation" id="question-nav"></div>
                            <button class="nav-btn next-btn" onclick="scrollQuestions(1)">&#8250;</button>
                        </div>
                    </div>
                    <div class="flex-grow-1 px-3 overflow-auto">
                        <div id="questions-container"></div>
                    </div>
                    <div class="p-3 border-top">
                        <div class="d-flex justify-content-between">
                            <button id="prev-btn" class="btn btn-outline-primary">Previous</button>
                            <button id="submit-round-btn" class="btn btn-success">Submit Round</button>
                            <button id="next-btn" class="btn btn-primary">Next</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6" id="reference-material-section">
                <div class="glass-card h-100 d-flex flex-column" style="max-height: calc(100vh - 100px);">
                    <div class="p-3 border-bottom bg-light">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-0">Reference Material</h6>
                            <div>
                                <button id="prev-page" class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-left"></i></button>
                                <span class="mx-2">Page <span id="page-num">1</span> of <span id="page-count">--</span></span>
                                <button id="next-page" class="btn btn-sm btn-outline-secondary"><i class="bi bi-chevron-right"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="flex-grow-1 overflow-auto text-center bg-secondary bg-opacity-10">
                        <canvas id="pdf-canvas"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- OTP Modal -->
    <div class="modal fade" id="otpModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Enter OTP</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>This is a private quiz. Please enter the OTP to access it.</p>
                    <input type="text" class="form-control" id="otp-input" placeholder="Enter OTP">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="verify-otp-btn">Verify</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal fade" id="resultsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Quiz Results</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="results-content"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" id="download-result-btn"><i class="bi bi-download"></i> Download Result</button>
                    <button type="button" class="btn btn-info" id="share-result-btn"><i class="bi bi-share"></i> Share</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Student Login Modal -->
    <div class="modal fade" id="studentLoginModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Student Authentication</h5>
                </div>
                <div id="student-login-section">
                    <form id="student-login-form">
                        <div class="modal-body">
                            <div id="student-login-error" class="alert alert-danger d-none"></div>
                            <div class="mb-3">
                                <label for="student-admission" class="form-label">Admission Number</label>
                                <input type="text" class="form-control" id="student-admission" placeholder="Enter Admission Number" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="student-phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="student-phone" placeholder="Enter Registered Phone Number" required autocomplete="off">
                            </div>
                        </div>
                        <div class="modal-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-primary" id="student-toggle-to-register">Register</button>
                            <div>
                                <button type="button" class="btn btn-secondary" id="student-login-cancel">Cancel</button>
                                <button type="submit" class="btn btn-primary" id="student-login-submit">
                                    <span class="spinner-border spinner-border-sm d-none" id="student-login-spinner" role="status" aria-hidden="true"></span>
                                    Verify &amp; Start Test
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div id="student-register-section" class="d-none">
                    <form id="student-register-form">
                        <div class="modal-body">
                            <div id="student-register-error" class="alert alert-danger d-none"></div>
                            <div class="mb-3">
                                <label for="student-reg-name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="student-reg-name" placeholder="Enter Name" required autocomplete="off">
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="student-reg-class" class="form-label">Class</label>
                                    <input type="text" class="form-control" id="student-reg-class" placeholder="Enter Class" required autocomplete="off">
                                </div>
                                <div class="col-md-6">
                                    <label for="student-reg-section" class="form-label">Section</label>
                                    <input type="text" class="form-control" id="student-reg-section" placeholder="Enter Section" required autocomplete="off">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="student-reg-roll" class="form-label">Roll Number</label>
                                <input type="text" class="form-control" id="student-reg-roll" placeholder="Enter Roll Number" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="student-reg-admission" class="form-label">Admission Number</label>
                                <input type="text" class="form-control" id="student-reg-admission" placeholder="Enter Admission Number" required autocomplete="off">
                            </div>
                            <div class="mb-3">
                                <label for="student-reg-phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="student-reg-phone" placeholder="Enter Phone Number" required autocomplete="off">
                            </div>
                        </div>
                        <div class="modal-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-primary" id="student-toggle-to-login">Back to Login</button>
                            <div>
                                <button type="button" class="btn btn-secondary" id="student-register-cancel">Cancel</button>
                                <button type="submit" class="btn btn-primary" id="student-register-submit">
                                    <span class="spinner-border spinner-border-sm d-none" id="student-register-spinner" role="status" aria-hidden="true"></span>
                                    Register &amp; Start Test
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
    <script src="app.js"></script>
    <script src="quiz-formats.js"></script>
    <script src="quiz-format-setup.js"></script>
</body>
</html>
